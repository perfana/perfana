  build-migration:
    needs: [read-version]
    name: Build Migration Runner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3  # TODO: pin to SHA — run: gh api repos/docker/setup-qemu-action/git/ref/tags/v3 --jq '.object.sha'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3  # TODO: pin to SHA — run: gh api repos/docker/setup-buildx-action/git/ref/tags/v3 --jq '.object.sha'

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3  # TODO: pin to SHA — run: gh api repos/docker/login-action/git/ref/tags/v3 --jq '.object.sha'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5  # TODO: pin to SHA — run: gh api repos/docker/metadata-action/git/ref/tags/v5 --jq '.object.sha'
        with:
          images: ${{ env.IMAGE_PREFIX }}/perfana-migration
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.read-version.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v5  # TODO: pin to SHA — run: gh api repos/docker/build-push-action/git/ref/tags/v5 --jq '.object.sha'
        with:
          context: .
          file: ./Dockerfile.migrations
          target: migrations
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' || github.event.inputs.push_images == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [read-version, build-web, build-api, build-worker, build-grafana-sync, build-perfana-report, build-migration]
    if: always()
    steps:
      - name: Check build results
        run: |
          echo "## Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Web (Next.js) | ${{ needs.build-web.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| API (NestJS) | ${{ needs.build-api.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Worker (BullMQ) | ${{ needs.build-worker.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Grafana Sync | ${{ needs.build-grafana-sync.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Perfana Report | ${{ needs.build-perfana-report.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Migration | ${{ needs.build-migration.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Platforms**: linux/amd64" >> $GITHUB_STEP_SUMMARY
          echo "**Registry**: Docker Hub (perfana)" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.build-web.result }}" == "failure" ]] || \
             [[ "${{ needs.build-api.result }}" == "failure" ]] || \
             [[ "${{ needs.build-worker.result }}" == "failure" ]] || \
             [[ "${{ needs.build-grafana-sync.result }}" == "failure" ]] || \
             [[ "${{ needs.build-perfana-report.result }}" == "failure" ]] || \
             [[ "${{ needs.build-migration.result }}" == "failure" ]]; then
            echo "❌ One or more builds failed"
            exit 1
          else
            echo "✅ All builds succeeded"
          fi
