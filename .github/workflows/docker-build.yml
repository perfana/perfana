          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ github.event.inputs.no_cache == 'true' && '' || 'type=gha' }}
          cache-to: type=gha,mode=max
          no-cache: ${{ github.event.inputs.no_cache == 'true' }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            BUILD_NUMBER=${{ github.run_number }}
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:3001/api' }}
            NEXT_PUBLIC_KEYCLOAK_URL=${{ secrets.NEXT_PUBLIC_KEYCLOAK_URL || 'http://localhost:8080' }}
            NEXT_PUBLIC_KEYCLOAK_REALM=${{ secrets.NEXT_PUBLIC_KEYCLOAK_REALM || 'perfana' }}
            NEXT_PUBLIC_KEYCLOAK_CLIENT_ID=${{ secrets.NEXT_PUBLIC_KEYCLOAK_CLIENT_ID || 'perfana-web' }}
            NEXT_PUBLIC_USE_KEYCLOAK_AUTH=${{ secrets.NEXT_PUBLIC_USE_KEYCLOAK_AUTH || 'true' }}

  build-perfana-report:
    needs: [read-version]
    name: Build Perfana Report (PDF Generation)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3  # TODO: pin to SHA — run: gh api repos/docker/setup-qemu-action/git/ref/tags/v3 --jq '.object.sha'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3  # TODO: pin to SHA — run: gh api repos/docker/setup-buildx-action/git/ref/tags/v3 --jq '.object.sha'

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3  # TODO: pin to SHA — run: gh api repos/docker/login-action/git/ref/tags/v3 --jq '.object.sha'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract metadata
