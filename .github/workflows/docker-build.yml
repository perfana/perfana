name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      push_images:
        description: 'Push images to registry'
        required: false
        type: boolean
        default: false
      no_cache:
        description: 'Build without cache (clean build)'
        required: false
        type: boolean
        default: false

env:
  IMAGE_PREFIX: perfana

jobs:
  read-version:
    name: Read Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Read version from VERSION file
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build-web:
    needs: [read-version]
    name: Build Web (Next.js)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3  # TODO: pin to SHA — run: gh api repos/docker/setup-qemu-action/git/ref/tags/v3 --jq '.object.sha'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3  # TODO: pin to SHA — run: gh api repos/docker/setup-buildx-action/git/ref/tags/v3 --jq '.object.sha'

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3  # TODO: pin to SHA — run: gh api repos/docker/login-action/git/ref/tags/v3 --jq '.object.sha'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5  # TODO: pin to SHA — run: gh api repos/docker/metadata-action/git/ref/tags/v5 --jq '.object.sha'
        with:
          images: ${{ env.IMAGE_PREFIX }}/perfana-web
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.read-version.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v5  # TODO: pin to SHA — run: gh api repos/docker/build-push-action/git/ref/tags/v5 --jq '.object.sha'
        with:
          context: .
          file: ./Dockerfile
          target: web
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' || github.event.inputs.push_images == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ github.event.inputs.no_cache == 'true' && '' || 'type=gha' }}
          cache-to: type=gha,mode=max
          no-cache: ${{ github.event.inputs.no_cache == 'true' }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            BUILD_NUMBER=${{ github.run_number }}
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:3001/api' }}
            NEXT_PUBLIC_KEYCLOAK_URL=${{ secrets.NEXT_PUBLIC_KEYCLOAK_URL || 'http://localhost:8080' }}
            NEXT_PUBLIC_KEYCLOAK_REALM=${{ secrets.NEXT_PUBLIC_KEYCLOAK_REALM || 'perfana' }}
            NEXT_PUBLIC_KEYCLOAK_CLIENT_ID=${{ secrets.NEXT_PUBLIC_KEYCLOAK_CLIENT_ID || 'perfana-web' }}
            NEXT_PUBLIC_USE_KEYCLOAK_AUTH=${{ secrets.NEXT_PUBLIC_USE_KEYCLOAK_AUTH || 'true' }}
            CSP_UPGRADE_INSECURE=${{ secrets.CSP_UPGRADE_INSECURE || 'false' }}
            NEXT_PUBLIC_CSP_FRAME_SRC=${{ secrets.NEXT_PUBLIC_CSP_FRAME_SRC || '' }}

  build-api:
    needs: [read-version]
    name: Build API (NestJS)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3  # TODO: pin to SHA — run: gh api repos/docker/setup-qemu-action/git/ref/tags/v3 --jq '.object.sha'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3  # TODO: pin to SHA — run: gh api repos/docker/setup-buildx-action/git/ref/tags/v3 --jq '.object.sha'

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3  # TODO: pin to SHA — run: gh api repos/docker/login-action/git/ref/tags/v3 --jq '.object.sha'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5  # TODO: pin to SHA — run: gh api repos/docker/metadata-action/git/ref/tags/v5 --jq '.object.sha'
        with:
          images: ${{ env.IMAGE_PREFIX }}/perfana-api
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.read-version.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v5  # TODO: pin to SHA — run: gh api repos/docker/build-push-action/git/ref/tags/v5 --jq '.object.sha'
        with:
          context: .
          file: ./Dockerfile
          target: api
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' || github.event.inputs.push_images == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ github.event.inputs.no_cache == 'true' && '' || 'type=gha' }}
          cache-to: type=gha,mode=max
          no-cache: ${{ github.event.inputs.no_cache == 'true' }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            BUILD_NUMBER=${{ github.run_number }}

  build-worker:
    needs: [read-version]
    name: Build Worker (BullMQ)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3  # TODO: pin to SHA — run: gh api repos/docker/setup-qemu-action/git/ref/tags/v3 --jq '.object.sha'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3  # TODO: pin to SHA — run: gh api repos/docker/setup-buildx-action/git/ref/tags/v3 --jq '.object.sha'

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3  # TODO: pin to SHA — run: gh api repos/docker/login-action/git/ref/tags/v3 --jq '.object.sha'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5  # TODO: pin to SHA — run: gh api repos/docker/metadata-action/git/ref/tags/v5 --jq '.object.sha'
        with:
          images: ${{ env.IMAGE_PREFIX }}/perfana-worker
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.read-version.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v5  # TODO: pin to SHA — run: gh api repos/docker/build-push-action/git/ref/tags/v5 --jq '.object.sha'
        with:
          context: .
          file: ./Dockerfile
          target: worker
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' || github.event.inputs.push_images == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ github.event.inputs.no_cache == 'true' && '' || 'type=gha' }}
          cache-to: type=gha,mode=max
          no-cache: ${{ github.event.inputs.no_cache == 'true' }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            BUILD_NUMBER=${{ github.run_number }}
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:3001/api' }}
            NEXT_PUBLIC_KEYCLOAK_URL=${{ secrets.NEXT_PUBLIC_KEYCLOAK_URL || 'http://localhost:8080' }}
            NEXT_PUBLIC_KEYCLOAK_REALM=${{ secrets.NEXT_PUBLIC_KEYCLOAK_REALM || 'perfana' }}
            NEXT_PUBLIC_KEYCLOAK_CLIENT_ID=${{ secrets.NEXT_PUBLIC_KEYCLOAK_CLIENT_ID || 'perfana-web' }}
            NEXT_PUBLIC_USE_KEYCLOAK_AUTH=${{ secrets.NEXT_PUBLIC_USE_KEYCLOAK_AUTH || 'true' }}

  build-grafana-sync:
    needs: [read-version]
    name: Build Grafana Sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3  # TODO: pin to SHA — run: gh api repos/docker/setup-qemu-action/git/ref/tags/v3 --jq '.object.sha'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3  # TODO: pin to SHA — run: gh api repos/docker/setup-buildx-action/git/ref/tags/v3 --jq '.object.sha'

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3  # TODO: pin to SHA — run: gh api repos/docker/login-action/git/ref/tags/v3 --jq '.object.sha'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5  # TODO: pin to SHA — run: gh api repos/docker/metadata-action/git/ref/tags/v5 --jq '.object.sha'
        with:
          images: ${{ env.IMAGE_PREFIX }}/perfana-grafana-sync
          tags: |
