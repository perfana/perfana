            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.read-version.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v5  # TODO: pin to SHA — run: gh api repos/docker/build-push-action/git/ref/tags/v5 --jq '.object.sha'
        with:
          context: .
          file: ./Dockerfile
          target: perfana-report
