          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' || github.event.inputs.push_images == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ github.event.inputs.no_cache == 'true' && '' || 'type=gha' }}
          cache-to: type=gha,mode=max
          no-cache: ${{ github.event.inputs.no_cache == 'true' }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            BUILD_NUMBER=${{ github.run_number }}

  build-migration:
    needs: [read-version]
    name: Build Migration Runner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        # Must match the build-push step's push condition: workflow_dispatch runs
        # with push_images=true also push, so they need credentials too.
        if: github.event_name == 'push' || github.event.inputs.push_images == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/perfana-migration
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.read-version.outputs.version }},enable=${{ github.event_name == 'push' }}

      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./Dockerfile.migrations
          target: migrations
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' || github.event.inputs.push_images == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  snyk-monitor:
    name: Snyk Monitor (images + app deps)
    runs-on: ubuntu-latest
    needs:
      [
        read-version,
        build-web,
        build-api,
        build-worker,
        build-grafana-sync,
        build-perfana-report,
        build-migration,
      ]
    # Only for builds that actually published the version tag this monitors. A develop push
    # would overwrite the projects with a non-release image, and the projects are untagged
    # (see below), so there would be no way to tell afterwards which one they hold.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    # Bookkeeping, never a release gate: a Snyk outage or an expired token must not fail a
    # build whose images are already pushed.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The `secrets` context is not available in a job-level `if`, so the gate is a step.
      - name: Check for SNYK_TOKEN
        id: gate
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "SNYK_TOKEN is not set — skipping Snyk monitoring." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install Snyk CLI
        if: steps.gate.outputs.has_token == 'true'
        run: npm install -g snyk@1.1301.2

      # OS layer only. Without --exclude-app-vulns, Snyk creates one npm project per
      # package.json it finds INSIDE each image — and every runtime image ships the whole
      # monorepo's manifests, which is 47 projects per run and 41 of them duplicates of
      # another app's. App dependencies are covered from the source tree in the next step,
      # which is where they belong.
      - name: Monitor container images (OS layer)
        if: steps.gate.outputs.has_token == 'true'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          VERSION: ${{ needs.read-version.outputs.version }}
        run: |
          set -u
          failed=0
          monitor() {
            image="$1"
            dockerfile="$2"
            echo "::group::snyk container monitor ${image}:${VERSION}"
            # No --target-reference: Snyk treats it as a branch-like discriminator and would
            # create a separate project per version, which is the sprawl this avoids. The
            # project stays untagged and updates in place; which version a snapshot holds is
            # recorded in its history.
            if ! snyk container monitor "${image}:${VERSION}" \
              --file="${dockerfile}" \
              --exclude-app-vulns; then
              echo "::warning::snyk container monitor failed for ${image}:${VERSION}"
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
          }
          monitor "${IMAGE_PREFIX}/perfana-web"          ./Dockerfile
          monitor "${IMAGE_PREFIX}/perfana-api"          ./Dockerfile
          monitor "${IMAGE_PREFIX}/perfana-worker"       ./Dockerfile
          monitor "${IMAGE_PREFIX}/perfana-grafana-sync" ./Dockerfile
          monitor "${IMAGE_PREFIX}/perfana-report"       ./Dockerfile
          monitor "${IMAGE_PREFIX}/perfana-migration"    ./Dockerfile.migrations
          echo "Monitored 6 images for ${VERSION}; ${failed} failed." >> "$GITHUB_STEP_SUMMARY"

      # The workspaces are not otherwise covered: before this, the only repo-level npm
      # projects were the root package.json and docs-site.
      - name: Monitor app dependencies from the source tree
        if: steps.gate.outputs.has_token == 'true'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          npm ci --ignore-scripts
          # --exclude keeps agent worktrees and Next.js build output out; both hold copies of
          # the repo's own manifests and each copy becomes its own Snyk project.
          snyk monitor --all-projects --exclude=.claude,.next \
            || echo "::warning::snyk monitor (source tree) failed"

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [read-version, build-web, build-api, build-worker, build-grafana-sync, build-perfana-report, build-migration]
    if: always()
    steps:
      - name: Check build results
        run: |
          echo "## Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Web (Next.js) | ${{ needs.build-web.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| API (NestJS) | ${{ needs.build-api.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Worker (BullMQ) | ${{ needs.build-worker.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Grafana Sync | ${{ needs.build-grafana-sync.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Perfana Report | ${{ needs.build-perfana-report.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Migration | ${{ needs.build-migration.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Platforms**: linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
          echo "**Registry**: Docker Hub (perfana)" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.build-web.result }}" == "failure" ]] || \
             [[ "${{ needs.build-api.result }}" == "failure" ]] || \
             [[ "${{ needs.build-worker.result }}" == "failure" ]] || \
             [[ "${{ needs.build-grafana-sync.result }}" == "failure" ]] || \
             [[ "${{ needs.build-perfana-report.result }}" == "failure" ]] || \
             [[ "${{ needs.build-migration.result }}" == "failure" ]]; then
            echo "❌ One or more builds failed"
            exit 1
          else
            echo "✅ All builds succeeded"
          fi
