name: PR Quality Gate - Test Suite

on:
  workflow_dispatch:
    inputs:
      run_shared:
        description: 'Run Shared Package Tests'
        required: false
        default: true
        type: boolean
      run_api:
        description: 'Run API Tests'
        required: false
        default: true
        type: boolean
      run_worker:
        description: 'Run Worker Tests'
        required: false
        default: true
        type: boolean
      run_grafana_sync:
        description: 'Run Grafana Sync Tests'
        required: false
        default: true
        type: boolean
      run_web:
        description: 'Run Web Tests'
        required: false
        default: true
        type: boolean
      run_quality_checks:
        description: 'Run Type Check & Lint'
        required: false
        default: true
        type: boolean

# Cancel in-progress runs for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Shared Package Tests
  test-shared:
    name: Shared Package Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: inputs.run_shared

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build shared package
        run: |
          cd packages/shared
          npm run build

      - name: Run shared package tests
        run: |
          cd packages/shared
          npm test -- --ci
        env:
          NODE_ENV: test
          CI: true

  # Job 2: API Tests (with testcontainers)
  test-api:
    name: API Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test-shared
    if: inputs.run_api && !cancelled()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build shared package
        run: |
          cd packages/shared
          npm run build

      - name: Run API tests with coverage
        run: |
          cd apps/api
          npm test -- --coverage
        env:
          NODE_ENV: test
          USE_TESTCONTAINERS: true

      - name: Check API coverage thresholds
        run: |
          node -e "
            const coverage = require('./coverage/apps/api/coverage-summary.json');
            const total = coverage.total;
            const threshold = 45;

            console.log('📊 API Coverage Report:');
            console.log('  Lines:      ' + total.lines.pct.toFixed(2) + '%');
            console.log('  Statements: ' + total.statements.pct.toFixed(2) + '%');
            console.log('  Functions:  ' + total.functions.pct.toFixed(2) + '%');
            console.log('  Branches:   ' + total.branches.pct.toFixed(2) + '%');

            if (total.lines.pct < threshold || total.statements.pct < threshold) {
              console.error('❌ Coverage below ' + threshold + '% threshold');
              process.exit(1);
            }
            console.log('✅ Coverage meets ' + threshold + '% threshold');
          "

      - name: Upload API coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/apps/api/lcov.info
          flags: api
          name: api-coverage

      - name: Upload API test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: api-test-results
          path: coverage/apps/api/
          retention-days: 7

  # Job 3: Worker Tests (with testcontainers)
  test-worker:
    name: Worker Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test-shared
    if: inputs.run_worker && !cancelled()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build shared package
        run: |
          cd packages/shared
          npm run build

      - name: Run worker tests with coverage
        run: |
          cd apps/worker
          npm run test:coverage
        env:
          NODE_ENV: test
          USE_TESTCONTAINERS: true

      - name: Check worker coverage
        run: |
          node -e "
            const coverage = require('./apps/worker/coverage/coverage-summary.json');
            const total = coverage.total;
            console.log('📊 Worker Coverage: ' + total.lines.pct.toFixed(2) + '%');
          "

      - name: Upload worker coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./apps/worker/coverage/lcov.info
          flags: worker
          name: worker-coverage

  # Job 4: Grafana Sync Tests
  test-grafana-sync:
    name: Grafana Sync Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test-shared
    if: inputs.run_grafana_sync && !cancelled()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build shared package
        run: |
          cd packages/shared
          npm run build

      - name: Run grafana-sync tests
        run: |
          cd apps/grafana-sync
          npm run test:coverage
        env:
          NODE_ENV: test
          USE_TESTCONTAINERS: true

      - name: Upload grafana-sync coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./apps/grafana-sync/coverage/lcov.info
          flags: grafana-sync
          name: grafana-sync-coverage

  # Job 5: Web Tests (parallel shards)
  test-web:
    name: Web Tests (Shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: test-shared
    if: inputs.run_web && !cancelled()

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build shared package
        run: |
          cd packages/shared
          npm run build

      - name: Run web tests (shard ${{ matrix.shard }}/2)
        run: |
          cd apps/web
          npm test -- --coverage --maxWorkers=2 --ci --shard=${{ matrix.shard }}/2
        env:
          NODE_ENV: test
          CI: true

      - name: Upload web coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./apps/web/coverage/lcov.info
          flags: web
          name: web-coverage-shard-${{ matrix.shard }}

  # Job 6: Type Check & Lint (parallel)
  quality-checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test-shared
    if: inputs.run_quality_checks && !cancelled()

    strategy:
      matrix:
        check: ['Type Check', 'Lint']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build shared package
        run: |
          cd packages/shared
          npm run build

      - name: Run check
        run: |
          if [ "${{ matrix.check }}" = "Type Check" ]; then
            npm run type-check
          elif [ "${{ matrix.check }}" = "Lint" ]; then
            npm run lint
          fi

  # Job 7: Quality Gate Summary
  quality-gate:
    name: Quality Gate ✓
    runs-on: ubuntu-latest
    needs: [test-shared, test-api, test-web, test-worker, test-grafana-sync, quality-checks]
    if: always()

    steps:
      - name: Check all tests passed
        env:
          SHARED_RESULT: ${{ needs.test-shared.result }}
          API_RESULT: ${{ needs.test-api.result }}
          WEB_RESULT: ${{ needs.test-web.result }}
          WORKER_RESULT: ${{ needs.test-worker.result }}
          GRAFANA_RESULT: ${{ needs.test-grafana-sync.result }}
          CHECKS_RESULT: ${{ needs.quality-checks.result }}
        run: |
          echo "📊 Quality Gate Results:"
          echo "  Shared:       $SHARED_RESULT"
          echo "  API:          $API_RESULT"
          echo "  Web:          $WEB_RESULT"
          echo "  Worker:       $WORKER_RESULT"
          echo "  Grafana Sync: $GRAFANA_RESULT"
          echo "  Checks:       $CHECKS_RESULT"

          # Check for failures (skip if job was skipped)
          if [ "$SHARED_RESULT" = "failure" ] || \
             [ "$API_RESULT" = "failure" ] || \
             [ "$WEB_RESULT" = "failure" ] || \
             [ "$WORKER_RESULT" = "failure" ] || \
             [ "$GRAFANA_RESULT" = "failure" ] || \
             [ "$CHECKS_RESULT" = "failure" ]; then
            echo "❌ Quality gate failed"
            exit 1
          fi

          echo "✅ All quality checks passed!"
