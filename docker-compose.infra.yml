# ================================================================================================
# Perfana Next-Gen Infrastructure Docker Compose
# ================================================================================================
# Infrastructure-only compose file for local development.
# Perfana services (api, web, worker, grafana-sync) run on the host via `npm run dev`.
#
# Prerequisites:
#   - perfana-demo repo cloned alongside this repo (for symlinked directories)
#   - Docker and Docker Compose installed
#
# Usage:
#   ./start-infra.sh          # Start all infrastructure
#   ./stop-infra.sh           # Stop all infrastructure
#   docker compose -f docker-compose.infra.yml ps   # Check status
# ================================================================================================

services:

######################################################################################################################
# DATABASE & AUTHENTICATION SERVICES
######################################################################################################################

  # PostgreSQL Database with TimescaleDB Extension
  postgres:
    image: timescale/timescaledb-ha:pg15
    container_name: perfana-postgres
    # TimescaleDB needs max_worker_processes >= timescaledb.max_background_workers
    # + max_parallel_workers + 1, and the image ships 8 against a default 16 + 8.
    # The job scheduler then loses the race for a slot and logs "failed to start a
    # background worker" instead of running the continuous-aggregate refreshes -
    # the CAGGs silently stop being materialised and every query that reads one
    # falls back to scanning the raw hypertable. Nothing errors; pages just crawl.
    command:
      - postgres
      - -c
      - max_worker_processes=32
    environment:
      POSTGRES_DB: perfana
      POSTGRES_USER: perfana
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-perfana}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/home/postgres/pgdata
      - ./database/init:/docker-entrypoint-initdb.d/
    networks:
      - perfana
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perfana -d perfana"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Keycloak Theme Provider - init container pattern
  keycloak-theme-provider:
    image: perfana/perfana-keycloak-theme:0.0.9
    container_name: perfana-keycloak-theme-provider
    command:
      - sh
      - -c
      - |
        echo "Copying custom keycloak theme..."
        cp -R /customTheme/* /theme
        echo "Custom theme copied successfully"
    volumes:
      - keycloak-theme:/theme
    networks:
      - perfana

  # Keycloak Authentication Server (using shared postgres database)
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: perfana-keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: perfana
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-perfana}
      KC_DB_SCHEMA: public
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ENABLED: true
      KC_HOSTNAME_STRICT_BACKCHANNEL: false
      KC_SPI_SSL_SSL_REQUIRED: none
      KC_SPI_SSL_SSL_REQUIRED_FOR_REQUESTS: none
      KC_PROXY: edge
      KC_PROXY_HEADERS: xforwarded
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB_POOL_INITIAL_SIZE: 5
      KC_DB_POOL_MAX_SIZE: 20
      KC_DB_POOL_MIN_SIZE: 5
      KC_HEALTH_ENABLED: true
    command: ["start-dev", "--health-enabled=true", "--import-realm"]
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realms:/opt/keycloak/data/import
      - keycloak-theme:/opt/keycloak/themes/perfanaTheme
    networks:
      - perfana
    depends_on:
      postgres:
        condition: service_healthy
      keycloak-theme-provider:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # Database Migration Runner - runs TypeORM migrations then exits
  perfana-migration:
    build:
      context: .
      dockerfile: Dockerfile.migrations
    container_name: perfana-migration
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: perfana
      DB_PASSWORD: ${POSTGRES_PASSWORD:-perfana}
      DB_NAME: perfana
      DB_SSL: "false"
    networks:
      - perfana
    depends_on:
      postgres:
        condition: service_healthy

######################################################################################################################
# INFRASTRUCTURE SERVICES
######################################################################################################################

  redis:
    image: redis:7-alpine
    container_name: perfana-redis
    ports:
      - "6379:6379"
    networks:
      - perfana
    volumes:
      - redis-storage:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana:
    image: grafana/grafana:12.3
    container_name: perfana-grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SECURITY_ADMIN_USER: "perfana"
      GF_SECURITY_ADMIN_PASSWORD: "perfana"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_INSTALL_PLUGINS: "marcusolsson-json-datasource, grafana-pyroscope-app"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./infra/grafana/grafana.ini:/etc/grafana/grafana.ini
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards
      - ./infra/grafana/provisioning/alerting:/etc/grafana/provisioning/alerting
    networks:
      - perfana
    depends_on:
      mariadb:
        condition: service_healthy

  tempo:
    image: grafana/tempo:latest
    container_name: perfana-tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo.yaml
    ports:
      - "3200:3200"   # Tempo HTTP API
      - "14268:14268" # Jaeger ingest
      - "14250:14250" # Jaeger GRPC
      - "4317:4317"   # OpenTelemetry GRPC
      - "4318:4318"   # OpenTelemetry HTTP
      - "9411:9411"   # Zipkin
    networks:
      - perfana

  pyroscope:
    image: grafana/pyroscope:latest
    container_name: perfana-pyroscope
    command: [ "server" ]
    volumes:
      - pyroscope-storage:/var/lib/pyroscope
    ports:
      - "4040:4040"   # Pyroscope HTTP API & UI
      - "4100:4100"   # Profiling data ingest
    networks:
      - perfana

  loki:
    image: grafana/loki:latest
    container_name: perfana-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./infra/loki/loki-config.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki
    user: "10001"
    networks:
      - perfana

  prometheus:
    image: prom/prometheus
    container_name: perfana-prometheus
    user: root
    volumes:
      - ./infra/prometheus:/prometheus
      - prometheus-storage:/data
    command:
      - '--config.file=/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/data'
      - "--web.enable-remote-write-receiver"
    ports:
      - "9090:9090"
    networks:
      - perfana

  alertmanager:
    image: prom/alertmanager
    container_name: perfana-alertmanager
    user: root
    volumes:
      - ./infra/prometheus:/prometheus
      - prometheus-storage:/data
    command:
      - '--config.file=/prometheus/alertmanager.yml'
      - '--storage.path=/data'
    ports:
      - "9093:9093"
    networks:
      - perfana

######################################################################################################################
# SUPPORTING DATABASES
######################################################################################################################

  mariadb:
    image: mariadb:10.5.5
    container_name: perfana-mariadb
    environment:
      MYSQL_ROOT_PASSWORD: perfana
    ports:
      - "3306:3306"
    networks:
      - perfana
    volumes:
      - ./infra/test_db:/docker-entrypoint-initdb.d
      - ./infra/mariadb:/etc/mysql/conf.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pperfana"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  influxdb:
    image: influxdb:1.8.3
    container_name: perfana-influxdb
    ports:
      - "8086:8086"
    volumes:
      - ./infra/influxdb/influxdb.conf:/etc/influxdb/influxdb.conf:ro
      - influxdb-storage:/var/lib/influxdb
      - ./infra/influxdb/init-influxdb.sh:/docker-entrypoint-initdb.d/init-influxdb.sh
    networks:
      - perfana
    entrypoint: /entrypoint.sh influxd

  telegraf:
    image: telegraf:1.33.1
    container_name: perfana-telegraf
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./infra/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    privileged: true
    user: telegraf:root
    networks:
      - perfana

######################################################################################################################
# SYSTEM UNDER TEST (Afterburner demo application)
######################################################################################################################

  afterburner-fe:
    image: perfana/afterburner:${SUT_VERSION:-2.4.3-good-baseline}
    container_name: perfana-afterburner-fe
    ports:
      - "8090:8080"
    environment:
      "spring.application.name": "afterburner-fe"
      "spring.profiles.active": "logstash"
      "afterburner.name": "afterburner-fe"
      "afterburner.logback.loki.remotehost": "loki"
      "afterburner.logback.loki.port": "3100"
      "management.metrics.tags.system_under_test": "PerfanaWebshop"
      "management.metrics.tags.test_environment": "acc"
      "management.metrics.tags.service": "afterburner-fe"
      "afterburner.remote.call.base_url": "http://afterburner-be:8080"
      "afterburner.remote.call.httpclient.socket.timeout.millis": "10000"
      "spring.zipkin.enabled": "true"
      "spring.zipkin.base-url": "http://tempo:9411/"
      "spring.sleuth.sampler.probability": "0.1"
      "spring.sleuth.keys.http.headers": "perfana-test-run-id,perfana-request-name"
      "spring.sleuth.propagation.tag.enabled": "true"
      "spring.sleuth.propagation.tag.whitelisted-keys": "perfana-test-run-id,perfana-request-name"
      "spring.sleuth.propagation-keys": "perfana-test-run-id,perfana-request-name"
      "spring.sleuth.baggage-keys": "perfana-test-run-id,perfana-request-name"
      "afterburner.mybatis.datasource.url": "jdbc:mariadb://mariadb:3306/employees"
      "afterburner.mybatis.datasource.username": "root"
      "afterburner.mybatis.datasource.password": "perfana"
      "afterburner.mybatis.datasource.driver-class-name": "org.mariadb.jdbc.Driver"
      "JDK_JAVA_OPTIONS": "-javaagent:/pyroscope.jar"
      "PYROSCOPE_APPLICATION_NAME": "afterburner-fe"
      "PYROSCOPE_PROFILING_INTERVAL": "13ms"
      "PYROSCOPE_FORMAT": "jfr"
      "PYROSCOPE_PROFILER_EVENT": "itimer"
      "PYROSCOPE_PROFILER_ALLOC": "512k"
      "PYROSCOPE_UPLOAD_INTERVAL": "3s"
      "PYROSCOPE_LOG_LEVEL": "info"
      "PYROSCOPE_SERVER_ADDRESS": "http://pyroscope:4040"
      "PYROSCOPE_AUTH_TOKEN": "abc123"
    restart: always
    networks:
      - perfana
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1024M

  afterburner-be:
    image: perfana/afterburner:${SUT_VERSION:-2.4.3-good-baseline}
    container_name: perfana-afterburner-be
    environment:
      "spring.application.name": "afterburner-be"
      "spring.profiles.active": "employee-db, logstash"
      "afterburner.name": "afterburner-be"
      "afterburner.logback.loki.remotehost": "loki"
      "afterburner.logback.loki.port": "3100"
      "management.metrics.tags.system_under_test": "PerfanaWebshop"
      "management.metrics.tags.test_environment": "acc"
      "management.metrics.tags.service": "afterburner-be"
      "afterburner.remote.call.httpclient.socket.timeout.millis": "10000"
      "spring.zipkin.enabled": "true"
      "spring.zipkin.base-url": "http://tempo:9411/"
      "spring.sleuth.sampler.probability": "0.1"
      "spring.sleuth.keys.http.headers": "perfana-test-run-id,perfana-request-name"
      "spring.sleuth.propagation.tag.enabled": "true"
      "spring.sleuth.propagation.tag.whitelisted-keys": "perfana-test-run-id,perfana-request-name"
      "spring.sleuth.propagation-keys": "perfana-test-run-id,perfana-request-name"
      "spring.sleuth.baggage-keys": "perfana-test-run-id,perfana-request-name"
      "afterburner.datasource.employee.jdbc-url": "jdbc:mariadb://mariadb:3306/employees"
      "afterburner.datasource.employee.username": "root"
      "afterburner.datasource.employee.password": "perfana"
      "afterburner.datasource.employee.poolMaximumActiveConnections": "5"
      "JDK_JAVA_OPTIONS": "-javaagent:jfr-exporter.jar=influxUrl=http://influxdb:8086,influxDatabase=jfr,tag=service/afterburner-fe,tag=systemUnderTest/PerfanaWebshop,tag=testEnvironment/acc -XX:NativeMemoryTracking=summary"
    restart: always
    networks:
      - perfana
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1024M

  wiremock:
    image: perfana/perfana-wiremock:2.32.0-alpine
    container_name: perfana-wiremock
    ports:
      - "8060:8080"
    networks:
      - perfana

######################################################################################################################
# MOCK SERVICES
######################################################################################################################

  dynatrace-saas-mock:
    image: wiremock/wiremock:3.3.1
    container_name: dynatrace-saas-mock
    ports:
      - "8092:8080"
    volumes:
      - ./infra/dynatrace-mock/saas/mappings:/home/wiremock/mappings:ro
    command: ["--global-response-templating", "--verbose"]
    networks:
      - perfana
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/__admin/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  dynatrace-managed-mock:
    image: wiremock/wiremock:3.3.1
    container_name: dynatrace-managed-mock
    ports:
      - "8091:8080"
    volumes:
      - ./infra/dynatrace-mock/managed/mappings:/home/wiremock/mappings:ro
    command: ["--global-response-templating", "--verbose"]
    networks:
      - perfana
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/__admin/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

######################################################################################################################
# LOAD TESTING
######################################################################################################################

  loadtest:
    image: perfana/maven-gatling-loadtest:0.0.6
    container_name: perfana-loadtest
    environment:
      SUT_VERSION: 1.0.0
      GIT_SHA: 6293480
      PERFANA_URL: http://host.docker.internal:3001
    volumes:
      - ./infra/loadtest:/loadtest
    entrypoint: >
      sh -c "
      echo Unpacking loadtest tar;
      mkdir -p /loadtest/src;
      tar -xzf /loadtest/loadtest-gatling.tar.gz --strip-components=1 -C /loadtest/src;
      echo Finished unpacking loadtest tar;
      tail -f /dev/null"
    networks:
      - perfana

  jmetertest:
    build:
      context: ./infra/jmeter
      dockerfile: Dockerfile
    container_name: perfana-jmetertest
    environment:
      SUT_VERSION: 1.0.0
      GIT_SHA: 6293480
      PERFANA_URL: http://host.docker.internal:3001
    volumes:
      - ./infra/jmeter:/tests
      - ./infra/jmeter/plugins:/opt/apache-jmeter-5.6.3/lib/ext
    networks:
      - perfana

######################################################################################################################
networks:
  perfana:
    driver: bridge

######################################################################################################################
volumes:
  postgres_data:
    driver: local
  keycloak_data:
    driver: local
  keycloak-theme:
    driver: local
  redis-storage:
  grafana-storage:
  pyroscope-storage:
  influxdb-storage:
  prometheus-storage:
  loki-data:
