site_name: Perfana Help Center
site_description: How to use Perfana to send, read, and analyze performance test runs.
site_url: https://docs.perfana.io/

theme:
  name: material
  font:
    text: Inter
    code: Roboto Mono
  logo: assets/favicon.png
  favicon: assets/favicon.png
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Switch to light mode }

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - md_in_html
  - def_list
  - toc: { permalink: true }
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

nav:
  - Home: index.md
  - Getting started:
      - getting-started/index.md
      - Navigate Perfana: getting-started/navigating.md
  - Test runs:
      - test-runs/index.md
      - Send your first test run: test-runs/send-first-run.md
      - Upload a JMeter result file: test-runs/upload-jtl.md
      - Find and filter test runs: test-runs/find-and-filter-runs.md
      - Read a test run: test-runs/read-a-run.md
      - Check SLO results: test-runs/slo-check-results.md
      - Understand ADAPT verdicts: test-runs/understand-adapt.md
      - Compare test runs: test-runs/compare-runs.md
      - Investigate root cause: test-runs/root-cause-analysis.md
      - Generate and share a report: test-runs/generate-report.md
  - Configuration:
      - configuration/index.md
      - Create a system under test: configuration/create-system-under-test.md
      - Define SLOs: configuration/define-slos.md
      - Create a profile: configuration/create-profile.md
      - Configure ADAPT: configuration/adapt-settings.md
      - Set up alert filters: configuration/alert-filters.md
      - Manage reporting templates: configuration/reporting-templates.md
  - Integrations:
      - integrations/index.md
      - Connect Grafana: integrations/connect-grafana.md
      - Connect Dynatrace: integrations/connect-dynatrace.md
      - Connect Pyroscope: integrations/connect-pyroscope.md
      - Connect distributed tracing: integrations/connect-tracing.md
  - Administration:
      - administration/index.md
      - Create an API key: administration/api-keys.md
      - Manage organizations: administration/organizations.md
      - Manage teams: administration/teams.md
      - Review audit logs: administration/audit-logs.md
  - API: api.md
  - Concepts: concepts.md
