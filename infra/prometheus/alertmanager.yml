global: {}

receivers:
- name: default-receiver
  webhook_configs:
  - url: 'http://host.docker.internal:3001/api/prometheus-alerts'
    send_resolved: false
    http_config:
      basic_auth:
        username: perfana
        password: perfana

route:
  receiver: default-receiver
  group_by: ['alertname']
  group_wait: 1s
  group_interval: 1s
  repeat_interval: 3h
