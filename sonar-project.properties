# ============================================
# Project Identification
# ============================================
sonar.projectKey=perfana
sonar.projectName=Perfana
sonar.projectVersion=0.1.0

# ============================================
# Source Code Configuration
# ============================================
# Monorepo structure: Specify all source directories across workspaces
# This includes all TypeScript source code from apps and packages
sonar.sources=\
  apps/api/src,\
  apps/web/app,\
  apps/web/components,\
  apps/web/contexts,\
  apps/web/hooks,\
  apps/web/lib,\
  apps/web/types,\
  apps/grafana-sync/src,\
  apps/worker/src,\
  packages/shared/src,\
  packages/config/src

# ============================================
# Test Files Configuration
# ============================================
# Separate test files from source code for accurate metrics
# Include all test patterns: *.spec.ts, *.test.ts, *.spec.tsx, *.test.tsx
sonar.tests=\
  apps/api/src,\
  apps/api/test,\
  apps/web/__tests__,\
  apps/grafana-sync/src,\
  apps/grafana-sync/test,\
  apps/worker/src/test,\
  apps/worker/tests

# Test file patterns - matches Jest configuration patterns
sonar.test.inclusions=\
  **/__tests__/**/*.ts,\
  **/__tests__/**/*.tsx,\
  **/__tests__/**/*.js,\
  **/__tests__/**/*.jsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/test/**/*.ts,\
  **/tests/**/*.ts

# ============================================
# Exclusions Configuration
# ============================================
# Exclude: build artifacts, dependencies, generated code, migrations, config files

# Global exclusions (applied to all analysis)
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/.next/**,\
  **/.turbo/**,\
  **/.swc/**,\
  **/coverage/**,\
  **/scripts/**,\
  **/*.config.js,\
  **/*.config.ts,\
  **/jest.setup.js,\
  **/jest.setup.ts,\
  **/*.d.ts,\
  **/migrations/**/*.ts,\
  **/database/migrations/**,\
  **/*.entity.ts,\
  **/*.dto.ts,\
  **/*.interface.ts,\
  **/*.module.ts,\
  **/main.ts,\
  **/index.ts,\
  **/*.seed.ts,\
  apps/api/create-admin-api-key.ts,\
  apps/api/debug-token.ts,\
  apps/api/run-migrations.ts,\
  apps/api/src/test/env.setup.ts,\
  apps/api/src/test/setup.ts,\
  apps/grafana-sync/test/setup.ts,\
  packages/shared/src/database/**,\
  packages/shared/ormconfig.ts,\
  packages/shared/src/types/database.ts,\
  **/generated/**,\
  **/__generated__/**,\
  **/public/**,\
  **/styles/**/*.css

# Coverage exclusions - files excluded from coverage calculation
sonar.coverage.exclusions=\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/*.spec.tsx,\
  **/*.test.tsx,\
  **/__tests__/**,\
  **/test/**,\
  **/tests/**,\
  **/*.config.js,\
  **/*.config.ts,\
  **/*.entity.ts,\
  **/*.dto.ts,\
  **/*.interface.ts,\
  **/*.module.ts,\
  **/main.ts,\
  **/migrations/**,\
  apps/api/src/test/**,\
  apps/worker/src/test/**,\
  apps/worker/tests/**,\
  packages/shared/src/database/migrations/**

# ============================================
# Language & File Configuration
# ============================================
sonar.language=ts
sonar.sourceEncoding=UTF-8

# TypeScript-specific settings
sonar.typescript.node=node
sonar.typescript.lcov.reportPaths=\
  coverage/apps/api/lcov-fixed.info,\
  apps/web/coverage/lcov-fixed.info,\
  apps/grafana-sync/coverage/lcov-fixed.info,\
  apps/worker/coverage/lcov-fixed.info

# JavaScript file patterns (for config files and any JS code)
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx

# ============================================
# Code Coverage Configuration
# ============================================
# Path to Jest/Vitest coverage reports (LCOV format)
sonar.coverage.jacoco.xmlReportPaths=
sonar.javascript.lcov.reportPaths=\
  coverage/apps/api/lcov-fixed.info,\
  apps/web/coverage/lcov-fixed.info,\
  apps/grafana-sync/coverage/lcov-fixed.info,\
  apps/worker/coverage/lcov-fixed.info

# Overall coverage threshold
sonar.coverage.minimum=60

# Note: Coverage reports are generated by test:coverage npm script
# Paths checked: coverage/apps/api/lcov-fixed.info, apps/{web,grafana-sync,worker}/coverage/lcov-fixed.info

# ============================================
# Duplication Detection
# ============================================
# Minimum tokens to detect code duplication (TypeScript-optimized)
sonar.cpd.ts.minimumTokens=50
sonar.cpd.tsx.minimumTokens=50

# Exclude DTOs and entities from duplication detection (often similar by design)
sonar.cpd.exclusions=\
  **/*.entity.ts,\
  **/*.dto.ts,\
  **/*.interface.ts,\
  **/migrations/**

# ============================================
# Quality Gate Thresholds
# ============================================
# These align with industry best practices and Jest configuration thresholds

# Code Coverage (matching Jest thresholds from grafana-sync: 80%)
sonar.coverage.exclusions.overallLineCoverageThreshold=70
sonar.coverage.exclusions.newCodeCoverageThreshold=80

# Code Smells & Technical Debt
sonar.qualitygate.wait=true
sonar.newCode.referenceBranch=main

# Maintainability Rating (A-E scale, C or better recommended)
sonar.maintainability.rating=C

# Reliability Rating (A-E scale, A = no bugs)
sonar.reliability.rating=A

# Security Rating (A-E scale, A = no vulnerabilities)
sonar.security.rating=A

# ============================================
# Code Analysis Configuration
# ============================================
# Issue severity thresholds
sonar.issue.ignore.multicriteria=e1,e2,e3

# e1: Ignore TODO comments in test files (common and acceptable)
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S1135
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.spec.ts

# e2: Ignore console.log in Next.js server components (legitimate use)
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S2228
sonar.issue.ignore.multicriteria.e2.resourceKey=apps/web/app/**/*.tsx

# e3: Ignore cognitive complexity in migration files (one-time scripts)
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.e3.resourceKey=**/migrations/*.ts

# ============================================
# Security Analysis
# ============================================
# Enable security hotspot detection
sonar.security.hotspots.enabled=true

# Security rules for Node.js/TypeScript
sonar.security.review.enabled=true

# ============================================
# Performance Optimization
# ============================================
# Optimize for large monorepo
sonar.scm.disabled=false
sonar.scm.provider=git

# Enable incremental analysis (faster subsequent scans)
sonar.projectBaseDir=.
sonar.working.directory=.sonarqube

# Scanner performance
sonar.log.level=INFO
sonar.verbose=false

# ============================================
# Project-Specific Rules
# ============================================
# Enforce strict TypeScript rules matching tsconfig.base.json

# Strict null checks (matches "strict": true in tsconfig)
sonar.typescript.tsconfigPath=tsconfig.base.json

# ESLint integration (if using SonarLint)
sonar.eslint.reportPaths=

# ============================================
# Branch & Pull Request Analysis
# ============================================
# Configure for CI/CD integration
# Uncomment and configure based on your CI system

# For GitHub Actions / GitHub
# sonar.pullrequest.provider=github
# sonar.pullrequest.github.repository=perfana/perfana

# For GitLab
# sonar.pullrequest.provider=gitlab
# sonar.gitlab.project_id=your-project-id

# For Bitbucket
# sonar.pullrequest.provider=bitbucket
# sonar.bitbucket.url=https://bitbucket.org

# ============================================
# Additional Metadata
# ============================================
sonar.links.homepage=https://github.com/perfana/perfana
sonar.links.ci=https://github.com/perfana/perfana/actions
sonar.links.issue=https://github.com/perfana/perfana/issues

# ============================================
# Monorepo Optimization Notes
# ============================================
# This configuration is optimized for a TypeScript monorepo with:
# - Multiple NestJS backend services (api, grafana-sync, worker)
# - Next.js frontend application (web)
# - Shared packages (shared, config)
#
# Key Design Decisions:
# 1. Separate source and test configurations for accurate metrics
# 2. Exclude generated code (migrations, entities, DTOs) from analysis
# 3. Include multiple coverage report paths for each workspace
# 4. Optimize duplication detection for TypeScript patterns
# 5. Set quality gates aligned with existing Jest thresholds
# 6. Exclude build artifacts and dependencies
# 7. Configure for incremental analysis (faster CI/CD)
#
# To Run:
# 1. Install SonarScanner: npm install -g sonarqube-scanner
# 2. Run tests with coverage: npm test -- --coverage
# 3. Run scanner: sonar-scanner
# 4. View results: http://localhost:9000 (or your SonarQube server)
#
# CI/CD Integration:
# - Add sonar-scanner command to your CI pipeline
# - Ensure coverage reports are generated before scanning
# - Configure branch/PR analysis for code review integration
